# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: rtl.zkssw_dashbord
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        ignoreCertErrors: true
        target:
          url: https://launchpaddev1.tapestry.com:8240/
          client: '110'
        app:
          name: ZKSSW_DASHBORD
          description: Dashboard
          package: ZFIORI
          transport: DE1K936084
        exclude:
          - /test/
          - /localService/
