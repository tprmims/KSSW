specVersion: "4.0"
metadata:
  name: rtl.zkssw_dashbord
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: true
        backend:
          - path: /sap
            url: https://vht1sqe1ci.sap.tapestry.com:44320
            client: "200"
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        component: RTL.ZKSSW_DASHBORD
        ui5Theme: sap_fiori_3
