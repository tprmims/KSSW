specVersion: "4.0"
metadata:
  name: rtl.zkssw_dashbord
type: application
framework:
  name: SAPUI5
  version: 1.79.0
  libraries:
    - name: sap.ovp
    - name: sap.fe.templates
    - name: sap.m
    - name: sap.f
    - name: sap.ushell
    - name: sap.ui.core
    - name: sap.ui.layout
    - name: sap.ui.generic.app
    - name: sap.ui.comp
    - name: sap.suite.ui.generic.template
    - name: sap.ui.rta
    - name: themelib_sap_bluecrystal
    - name: themelib_sap_fiori_3
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false
        backend:
          - path: /sap
            url: https://vht1sde1ci.sap.tapestry.com:44340
            client: "200"
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        component: RTL.ZKSSW_DASHBORD
        ui5Theme: sap_fiori_3
